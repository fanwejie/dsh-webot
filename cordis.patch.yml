# weBot — WeChat channel for DeepSeek Harness.
#
# One Host row. The package.json `dsh.client` declaration makes the web app load
# ./client as the browser half, which owns the 「weBot设置」 button in the settings
# header and the full-screen panel it opens.
#
# Row id matches the package name: package name, this row id, and the Client
# module id in client.js must stay equal. The installer resolves the row by this
# name against the installed package.
#
# The row carries no config. Every setting — the bound account, the approval mode,
# the prompt, the notification rules — lives in the channel's own state file
# (`$DSH_HOME/webot/state.json`) and is edited from the panel, so this file never
# needs editing after install.
- insert:
    - id: dsh-webot
      name: dsh-webot
